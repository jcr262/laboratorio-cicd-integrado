name: 02 - Pipeline de Integracion Continua (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Analisis estatico con Flake8 (Linter)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Ejecutar Pruebas Unitarias con PyTest
        run: pytest -v

      - name: Compilar Imagen Docker (Prueba de Empaquetado)
        run: docker build -t app-muestra:${{ github.sha }} .
